# apps/platform/pyproject.toml
# =============================================================================
# FireSight - platform 端配置(hatchling backend)
# =============================================================================

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"


[project]
name = "fire-sight-platform"
dynamic = ["version"]
description = "FireSight - 火灾烟雾智能预警系统核心引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FireSight Team" },
]
keywords = ["fire-detection", "smoke-detection", "yolo", "object-detection", "ml-platform"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "colorlog>=6.7.0",
    "psutil>=5.9.0",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.5,<3",
    "jinja2>=3.1.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]


# =============================================================================
# Entry-point Scripts (PEP 621 标准字段)
# =============================================================================
[project.scripts]
fs-init = "fire_sight_platform.cli.init_project:initialize_project"
fs-transform = "fire_sight_platform.cli.transform_data:_entry"
fs-validate = "fire_sight_platform.cli.validate_data:_entry"


# =============================================================================
# Hatchling 配置
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/fire_sight_platform"]

[tool.hatch.version]
path = "src/fire_sight_platform/_version.py"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
